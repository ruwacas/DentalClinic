---
deployment:
  tasks:
    - export APPPATH=/home/xbwpuvvj/repositories/DentalClinic
    - export DEPLOYPATH=/home/xbwpuvvj/public_html
    - /bin/mkdir -p "$DEPLOYPATH"

    # Install production dependencies in the application path.
    - /opt/alt/php82/usr/bin/php /home/xbwpuvvj/bin/composer install --no-dev --prefer-dist --optimize-autoloader -d "$APPPATH"

    # Refresh Laravel caches.
    - /opt/alt/php82/usr/bin/php "$APPPATH/artisan" optimize:clear
    - /opt/alt/php82/usr/bin/php "$APPPATH/artisan" config:cache
    - /opt/alt/php82/usr/bin/php "$APPPATH/artisan" route:cache
    - /opt/alt/php82/usr/bin/php "$APPPATH/artisan" view:cache

    # Publish only /public to public_html.
    - /bin/rsync -a --delete "$APPPATH/public/" "$DEPLOYPATH/"

    # Rewrite index.php paths so public_html can bootstrap Laravel from APPPATH.
    - /bin/sed -i "s|__DIR__.'/../storage/framework/maintenance.php'|'$APPPATH/storage/framework/maintenance.php'|" "$DEPLOYPATH/index.php"
    - /bin/sed -i "s|__DIR__.'/../vendor/autoload.php'|'$APPPATH/vendor/autoload.php'|" "$DEPLOYPATH/index.php"
    - /bin/sed -i "s|__DIR__.'/../bootstrap/app.php'|'$APPPATH/bootstrap/app.php'|" "$DEPLOYPATH/index.php"
